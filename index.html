<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parametric Model Maker</title>
    <link rel="stylesheet" href="style.css?v=5">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Import maps polyfill -->
    <script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
    <div id="error-log" style="position:fixed; top:0; left:0; width:100%; background:red; color:white; font-family:monospace; z-index:9999; padding: 10px; box-sizing: border-box; display: none;"></div>
    <script>
        window.onerror = function(msg, url, line, col, error) {
            var log = document.getElementById('error-log');
            log.style.display = 'block';
            log.innerHTML += msg + ' at ' + line + ':' + col + '<br>';
            if (error && error.stack) log.innerHTML += '<pre>' + error.stack + '</pre>';
        };
    </script>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
                "three-mesh-bvh": "https://unpkg.com/three-mesh-bvh@0.7.3/build/index.module.js",
                "three-bvh-csg": "https://unpkg.com/three-bvh-csg@0.0.16/build/index.module.js"
            }
        }
    </script>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <button class="back-btn"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
                <h2>Parametric Model Maker</h2>
                <div class="header-actions">
                    <button class="icon-btn">💾</button>
                    <button id="export-btn" class="download-btn">Download</button>
                </div>
            </div>

            <div class="sidebar-content">
                <!-- Model Section -->
                <div class="section">
                    <div class="section-header">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
                        <h3>Model</h3>
                        <svg class="chevron" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
                    </div>
                    <div class="section-body">
                        <div class="model-preview-card">
                            <div class="model-image">
                                <span>3D Text</span>
                            </div>
                            <div class="model-info">
                                <h4>Parametric Decorative Name</h4>
                                <p>Design3D_Lab</p>
                            </div>
                        </div>
                        <div class="dimensions-display" id="dimensions-display">
                            <strong>Output Size:</strong><br/>
                            <span id="dim-x">0</span>W x <span id="dim-y">0</span>H x <span id="dim-z">0</span>D mm
                        </div>
                    </div>
                </div>

                <!-- Customize Section -->
                <div class="section">
                    <div class="section-header">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
                        <h3>Customize</h3>
                    </div>
                    <div class="section-body">
                        <!-- Parameters -->
                        <div class="parameters-header">
                            <h4>Parameters</h4>
                            <svg class="chevron" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
                        </div>
                        
                        <div class="control-group">
                            <label>string <span class="help-text">Write the desired name here:</span></label>
                            <input type="text" id="name-input" value="Zoheb">
                        </div>

                        <div class="control-group">
                            <label>font <span class="help-text">Pick any font you prefer:</span></label>
                            <select id="font-select">
                                <optgroup label="Artistic & Script">
                                    <option value="https://raw.githubusercontent.com/google/fonts/main/ofl/pacifico/Pacifico-Regular.ttf">Pacifico (Brush Script)</option>
                                    <option value="https://raw.githubusercontent.com/google/fonts/main/ofl/greatvibes/GreatVibes-Regular.ttf">Great Vibes (Elegant Calligraphy)</option>
                                    <option value="https://raw.githubusercontent.com/google/fonts/main/ofl/caveatbrush/CaveatBrush-Regular.ttf">Caveat Brush (Marker)</option>
                                    <option value="https://raw.githubusercontent.com/google/fonts/main/ofl/indieflower/IndieFlower-Regular.ttf">Indie Flower (Handwriting)</option>
                                    <option value="https://raw.githubusercontent.com/google/fonts/main/ofl/shadowsintolight/ShadowsIntoLight.ttf">Shadows Into Light (Neat)</option>
                                    <option value="https://raw.githubusercontent.com/google/fonts/main/ofl/amaticsc/AmaticSC-Bold.ttf">Amatic SC (Tall Hand)</option>
                                    <option value="https://raw.githubusercontent.com/google/fonts/main/ofl/courgette/Courgette-Regular.ttf">Courgette (Brush Script)</option>
                                    <option value="https://raw.githubusercontent.com/google/fonts/main/ofl/cookie/Cookie-Regular.ttf">Cookie (Calligraphy)</option>
                                    <option value="https://raw.githubusercontent.com/google/fonts/main/ofl/bangers/Bangers-Regular.ttf">Bangers (Comic)</option>
                                    <option value="https://raw.githubusercontent.com/google/fonts/main/ofl/righteous/Righteous-Regular.ttf">Righteous (Art Deco)</option>
                                    <option value="https://raw.githubusercontent.com/google/fonts/main/ofl/creepster/Creepster-Regular.ttf">Creepster (Spooky)</option>
                                </optgroup>
                                <optgroup label="Standard (Built-in)">
                                    <option value="helvetiker_regular.typeface.json">Helvetiker Regular</option>
                                    <option value="helvetiker_bold.typeface.json">Helvetiker Bold</option>
                                    <option value="optimer_regular.typeface.json">Optimer Regular</option>
                                    <option value="optimer_bold.typeface.json">Optimer Bold</option>
                                    <option value="gentilis_regular.typeface.json">Gentilis Regular</option>
                                    <option value="gentilis_bold.typeface.json">Gentilis Bold</option>
                                    <option value="droid/droid_sans_regular.typeface.json">Droid Sans Regular</option>
                                    <option value="droid/droid_sans_bold.typeface.json">Droid Sans Bold</option>
                                    <option value="droid/droid_serif_regular.typeface.json">Droid Serif Regular</option>
                                    <option value="droid/droid_serif_bold.typeface.json">Droid Serif Bold</option>
                                </optgroup>
                            </select>
                        </div>
                        
                        <!-- Sizing Mode -->
                        <div class="control-group">
                            <label>Sizing Method <span class="help-text">How to determine dimensions:</span></label>
                            <select id="sizing-mode">
                                <option value="exact">Exact Dimensions (Stretch)</option>
                                <option value="font">Natural Font Size</option>
                            </select>
                        </div>
                        
                        <!-- Text Parameters -->
                        <div class="control-group" id="group-font-size">
                            <label>Base Font Size <span class="help-text">Overall font size:</span></label>
                            <div class="number-input">
                                <input type="number" id="text-size" value="50" min="10" max="150" step="1">
                                <div class="number-controls">
                                    <button id="size-minus">-</button>
                                    <button id="size-plus">+</button>
                                </div>
                            </div>
                        </div>

                        <!-- Beautification elements moved to right panel -->
                        
                        <div class="control-group" id="group-target-width">
                            <label>Target Width (X) <span class="help-text">Set exact width in mm:</span></label>
                            <div class="number-input">
                                <input type="number" id="target-width" value="150" min="10" max="500" step="1">
                                <div class="number-controls">
                                    <button id="width-minus">-</button>
                                    <button id="width-plus">+</button>
                                </div>
                            </div>
                        </div>
                        
                        <div class="control-group" id="group-target-height">
                            <label>Target Height (Y) <span class="help-text">Set exact height in mm:</span></label>
                            <div class="number-input">
                                <input type="number" id="target-height" value="50" min="5" max="200" step="1">
                                <div class="number-controls">
                                    <button id="height-minus">-</button>
                                    <button id="height-plus">+</button>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>

                <!-- Base Section -->
                <div class="section">
                    <div class="section-header">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="18" width="18" height="4" rx="1"></rect><path d="M5 18v-4a7 7 0 0 1 14 0v4"></path></svg>
                        <h3>Base Settings</h3>
                    </div>
                    <div class="section-body">
                        <!-- Base Options -->
                        <div class="control-group">
                            <label class="checkbox-label">
                                <input type="checkbox" id="include-base" checked>
                                include base <span class="help-text">Add a support stand</span>
                            </label>
                        </div>
                        
                        <div id="base-options">
                            <div class="control-group">
                                <label>Base Padding (mm) <span class="help-text">Extra size around text:</span></label>
                                <div class="number-input">
                                    <input type="number" id="base-padding" value="10" min="0" max="50" step="1">
                                    <div class="number-controls">
                                        <button id="pad-minus">-</button>
                                        <button id="pad-plus">+</button>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="control-group">
                                <label>Base Thickness (Y) <span class="help-text">Height of the base (mm):</span></label>
                                <div class="number-input">
                                    <input type="number" id="base-height" value="5" min="1" max="30" step="1">
                                    <div class="number-controls">
                                        <button id="baseh-minus">-</button>
                                        <button id="baseh-plus">+</button>
                                    </div>
                                </div>
                            </div>

                            <div class="control-group">
                                <label>Base Depth (Z) <span class="help-text">Extrusion of the base (mm):</span></label>
                                <div class="number-input">
                                    <input type="number" id="base-depth" value="30" min="5" max="200" step="1">
                                    <div class="number-controls">
                                        <button id="based-minus">-</button>
                                        <button id="based-plus">+</button>
                                    </div>
                                </div>
                            </div>

                            <!-- Edge styling moved to right panel -->
                        </div>

                    </div>
                </div>
            </div>
            
            <!-- Scroll Indicator -->
            <div class="scroll-indicator" id="left-scroll-indicator">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
            </div>
        </div>

        <!-- Right Sidebar (Beautification) -->
        <div class="sidebar right-sidebar" id="right-sidebar">
            <div class="sidebar-header">
                <h2>✨ Beautify</h2>
                <div class="header-actions">
                    <button id="close-beautify" class="icon-btn">×</button>
                </div>
            </div>
            <div class="sidebar-content">
                <div class="section">
                    <div class="section-header">
                        <h3>Typography Details</h3>
                    </div>
                    <div class="section-body">
                        <div class="control-group" id="group-letter-spacing">
                            <label>Letter Spacing <span class="tooltip">Squish or spread letters</span></label>
                            <div class="number-input">
                                <input type="number" id="letter-spacing" value="0" min="-50" max="50" step="1">
                                <div class="number-controls">
                                    <button id="spacing-minus">-</button>
                                    <button id="spacing-plus">+</button>
                                </div>
                            </div>
                        </div>
                        
                        <div class="control-group">
                            <label>Vertical Offset (mm) <span class="tooltip">Move text up or down relative to base</span></label>
                            <div class="number-input">
                                <input type="number" id="text-y-offset" value="0" min="-100" max="100" step="1">
                                <div class="number-controls">
                                    <button id="yoffset-minus">-</button>
                                    <button id="yoffset-plus">+</button>
                                </div>
                            </div>
                        </div>

                        <div class="control-group">
                            <label>Text Depth (Z) <span class="help-text">Thickness/Extrusion of letters:</span></label>
                            <div class="number-input">
                                <input type="number" id="text-thickness" value="10" min="1" max="100" step="1">
                                <div class="number-controls">
                                    <button id="thickness-minus">-</button>
                                    <button id="thickness-plus">+</button>
                                </div>
                            </div>
                        </div>

                        <div class="control-group">
                            <label>Text Edge Style <span class="help-text">Chamfer or Fillet:</span></label>
                            <select id="text-edge-style">
                                <option value="none">Square (None)</option>
                                <option value="chamfer">Chamfer (Straight cut)</option>
                                <option value="fillet">Fillet (Rounded)</option>
                            </select>
                        </div>

                        <div class="control-group" id="group-text-edge-radius" style="display:none;">
                            <label>Edge Radius <span class="help-text">Size of the cut (mm):</span></label>
                            <div class="number-input">
                                <input type="number" id="text-edge-radius" value="1" min="0.1" max="10" step="0.5">
                                <div class="number-controls">
                                    <button id="textrad-minus">-</button>
                                    <button id="textrad-plus">+</button>
                                </div>
                            </div>
                        </div>

                        <div class="control-group" id="group-text-edge-side" style="display:none;">
                            <label>Apply To <span class="help-text">Front & back, or just front?</span></label>
                            <select id="text-edge-side">
                                <option value="front-back">Front & Back</option>
                                <option value="front-only">Front Only</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="section">
                    <div class="section-header">
                        <h3>Base Details</h3>
                    </div>
                    <div class="section-body">
                        <div class="control-group">
                            <label>Base Edge Style <span class="help-text">Chamfer or Fillet:</span></label>
                            <select id="base-edge-style">
                                <option value="none">Square (None)</option>
                                <option value="chamfer">Chamfer (Straight cut)</option>
                                <option value="fillet">Fillet (Rounded)</option>
                            </select>
                        </div>

                        <div class="control-group" id="group-base-edge-side" style="display:none;">
                            <label>Apply To <span class="help-text">Top & bottom, or top only?</span></label>
                            <select id="base-edge-side">
                                <option value="top-only">Top Only</option>
                                <option value="top-bottom">Top & Bottom</option>
                            </select>
                        </div>

                        <div class="control-group" id="group-base-edge-radius" style="display:none;">
                            <label>Edge Radius <span class="help-text">Size of the cut (mm):</span></label>
                            <div class="number-input">
                                <input type="number" id="base-edge-radius" value="2" min="0" max="20" step="0.5">
                                <div class="number-controls">
                                    <button id="edgerad-minus">-</button>
                                    <button id="edgerad-plus">+</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 3D Canvas Area -->
        <div class="canvas-wrapper">
            <div class="top-right-actions">
                <button id="undo-btn" class="floating-btn reset-btn" title="Undo (Ctrl+Z)" disabled>↶ Undo</button>
                <button id="redo-btn" class="floating-btn reset-btn" title="Redo (Ctrl+Y)" disabled>↷ Redo</button>
                <button id="reset-defaults" class="floating-btn reset-btn">↺ Reset</button>
                <button id="open-beautify" class="floating-btn">✨ Beautify Settings</button>
            </div>
            <div id="canvas-container"></div>
            <div class="canvas-controls">
                <button class="view-btn">-</button>
                <button class="view-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg>
                </button>
            </div>
        </div>
    </div>

    <!-- Application Script with cache buster -->
    <script type="module" src="app.js?v=22"></script>
</body>
</html>
